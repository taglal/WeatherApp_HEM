
<h3>
    <i class="bi bi-speedometer2"></i>
    Admin Dashboard
</h3>

<hr>

<!-- STATISZTIKÁK -->

<div class="row">

    <!-- WEATHER RECORDS -->
    <div class="col-md-6 col-lg-3 mb-3">

        <div class="card shadow-sm h-100">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h6 class="text-muted">
                            Weather Records
                        </h6>

                        <h3 id="totalRecords">
                            0
                        </h3>
                    </div>

                    <i class="bi bi-cloud-sun fs-1 text-primary"></i>

                </div>

            </div>

        </div>

    </div>


    <!-- LOCATIONS -->
    <div class="col-md-6 col-lg-3 mb-3">

        <div class="card shadow-sm h-100">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h6 class="text-muted">
                            Locations
                        </h6>

                        <h3 id="totalLocations">
                            0
                        </h3>
                    </div>

                    <i class="bi bi-geo-alt fs-1 text-success"></i>

                </div>

            </div>

        </div>

    </div>


    <!-- AVERAGE TEMPERATURE -->
    <div class="col-md-6 col-lg-3 mb-3">

        <div class="card shadow-sm h-100">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h6 class="text-muted">
                            Average Temperature
                        </h6>

                        <h3 id="averageTemperature">
                            0 °C
                        </h3>
                    </div>

                    <i class="bi bi-thermometer-half fs-1 text-danger"></i>

                </div>

            </div>

        </div>

    </div>


    <!-- AVERAGE HUMIDITY -->
    <div class="col-md-6 col-lg-3 mb-3">

        <div class="card shadow-sm h-100">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h6 class="text-muted">
                            Average Humidity
                        </h6>

                        <h3 id="averageHumidity">
                            0 %
                        </h3>
                    </div>

                    <i class="bi bi-droplet fs-1 text-info"></i>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- LATEST WEATHER RECORDS -->

<div class="card shadow-sm mt-3">

    <div class="card-body">

        <h5 class="card-title mb-3">

            <i class="bi bi-clock-history"></i>
            Latest Weather Records

        </h5>


        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Location</th>

                        <th>Temperature</th>

                        <th>Weather</th>

                        <th>Precipitation</th>

                        <th>Humidity</th>

                        <th>Wind</th>

                    </tr>

                </thead>

                <tbody id="latestWeatherList">

                    <tr>

                        <td colspan="7" class="text-center text-muted">

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- WEATHER TYPES -->

<div class="card shadow-sm mt-4">

    <div class="card-body">

        <h5 class="card-title mb-3">

            <i class="bi bi-clouds"></i>
            Weather Types

        </h5>


        <div id="weatherTypesList">

            <div class="text-center text-muted">

                Loading...

            </div>

        </div>

    </div>

</div>
