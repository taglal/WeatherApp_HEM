
<div class="password-page">

    
    <div class="password-header">

        <div class="password-header-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <div class="password-header-content">
            <div class="password-header-small">
                WEATHER APP
            </div>

            <h3>Change Password</h3>

            <p>
                Update your password to keep your account secure.
            </p>
        </div>

    </div>


    
    <div class="password-content">

        <div class="password-card">

            <div class="password-card-heading">

                <div class="password-card-heading-icon">
                    <i class="bi bi-key-fill"></i>
                </div>

                <div>
                    <h5>Change your password</h5>
                    <p>Enter your current password and choose a new one.</p>
                </div>

            </div>


            <div class="password-divider"></div>


           
            <div class="password-form-group">

                <label for="oldPassword">
                    Current password
                </label>

                <div class="password-input-wrapper">

                    <i class="bi bi-lock password-input-icon"></i>

                    <input
                        type="password"
                        id="oldPassword"
                        class="form-control password-input"
                        placeholder="Enter current password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePasswordVisibility('oldPassword', this)"
                        aria-label="Show or hide current password"
                    >
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

            </div>


            
            <div class="password-form-group">

                <label for="newPassword">
                    New password
                </label>

                <div class="password-input-wrapper">

                    <i class="bi bi-shield-lock password-input-icon"></i>

                    <input
                        type="password"
                        id="newPassword"
                        class="form-control password-input"
                        placeholder="Enter new password"
                        minlength="6"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePasswordVisibility('newPassword', this)"
                        aria-label="Show or hide new password"
                    >
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <div class="password-help">
                    <i class="bi bi-info-circle"></i>
                    Password must be at least 6 characters long.
                </div>

            </div>


            
            <div class="password-form-group">

                <label for="confirmPassword">
                    Confirm new password
                </label>

                <div class="password-input-wrapper">

                    <i class="bi bi-check2-circle password-input-icon"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control password-input"
                        placeholder="Confirm new password"
                        minlength="6"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePasswordVisibility('confirmPassword', this)"
                        aria-label="Show or hide password confirmation"
                    >
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

            </div>


            
            <button
                type="button"
                class="password-submit-button"
                onclick="changePassword()"
            >
                <i class="bi bi-shield-check"></i>
                Change password
            </button>


            <div class="password-security-note">
                <i class="bi bi-shield-check"></i>

                <div>
                    <strong>Keep your account secure</strong>
                    <p>Use a password that you don't use for other accounts.</p>
                </div>
            </div>

        </div>

    </div>

</div>
