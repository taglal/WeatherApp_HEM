<div class="home-container">

    <!-- =========================================
         WELCOME
    ========================================== -->

    <div class="welcome-card">

        <div class="welcome-content">

            <div>

                <div class="welcome-small">
                    <i class="bi bi-stars"></i>
                    WEATHER APP
                </div>

                <h2 id="homeGreeting">
                    Üdvözöllek!
                </h2>

                <p id="homeGreetingText">
                    Örülünk, hogy újra itt vagy.
                </p>

            </div>

<div class="welcome-icon">
    <button
        type="button"
        class="welcome-icon-button"
        onclick="toggleTheme()">

        <i id="homeGreetingIcon" class="bi bi-sun"></i>

    </button>
</div>

        </div>

    </div>


    <!-- =========================================
         SECTION TITLE
    ========================================== -->

    <div class="home-section-title">

        <h4>
            <i class="bi bi-cloud-sun"></i>
            Mai időjárás
        </h4>

    </div>


    <!-- =========================================
         WEATHER MAIN CARD
    ========================================== -->

    <div class="home-weather-main">


        <!-- LOCATION + DATE -->

        <div class="weather-header">

            <div class="weather-location">

                <i class="bi bi-geo-alt-fill"></i>

                <span id="homeWeatherLocation">
                    -
                </span>

            </div>


            <div
                class="weather-date"
                id="homeWeatherDate">
                -
            </div>

        </div>


        <!-- WEATHER TYPE -->

        <div class="weather-type">

            <div class="weather-type-icon">

                <i class="bi bi-cloud-sun"></i>

            </div>


            <div
                class="weather-type-text"
                id="homeWeatherType">

                -

            </div>

        </div>


        <!-- =========================================
             MAIN TEMPERATURE
        ========================================== -->

        <div class="home-temperature">

            <div class="home-temperature-value">

                <span id="homeTempMain">
                    -- °C
                </span>

            </div>

        </div>


        <!-- =========================================
             WEATHER INFORMATION
        ========================================== -->

        <div class="weather-info-grid">


            <!-- MINIMUM -->

            <div class="weather-info-card">

                <div class="weather-info-icon">

                    <i class="bi bi-thermometer-low"></i>

                </div>

                <div class="weather-info-title">
                    Minimum
                </div>

                <div
                    class="weather-info-value"
                    id="homeTempMin">

                    -- °C

                </div>

            </div>


            <!-- MAXIMUM -->

            <div class="weather-info-card">

                <div class="weather-info-icon">

                    <i class="bi bi-thermometer-high"></i>

                </div>

                <div class="weather-info-title">
                    Maximum
                </div>

                <div
                    class="weather-info-value"
                    id="homeTempMax">

                    -- °C

                </div>

            </div>


            <!-- HUMIDITY -->

            <div class="weather-info-card">

                <div class="weather-info-icon">

                    <i class="bi bi-droplet"></i>

                </div>

                <div class="weather-info-title">
                    Páratartalom
                </div>

                <div
                    class="weather-info-value"
                    id="homeHumidity">

                    -- %

                </div>

            </div>


            <!-- PRECIPITATION -->

            <div class="weather-info-card">

                <div class="weather-info-icon">

                    <i class="bi bi-cloud-rain"></i>

                </div>

                <div class="weather-info-title">
                    Csapadék
                </div>

                <div
                    class="weather-info-value"
                    id="homePrecipitation">

                    -- mm

                </div>

            </div>


            <!-- WIND -->

            <div class="weather-info-card">

                <div class="weather-info-icon">

                    <i class="bi bi-wind"></i>

                </div>

                <div class="weather-info-title">
                    Szélsebesség
                </div>

                <div
                    class="weather-info-value"
                    id="homeWind">

                    -- km/h

                </div>

            </div>


            <!-- UV -->

            <div class="weather-info-card">

                <div class="weather-info-icon">

                    <i class="bi bi-sun"></i>

                </div>

                <div class="weather-info-title">
                    UV-index
                </div>

                <div
                    class="weather-info-value"
                    id="homeUv">

                    --

                </div>

            </div>

        </div>


        <!-- =========================================
             LAST UPDATE
        ========================================== -->

        <div class="home-last-update">

            <i class="bi bi-arrow-clockwise"></i>

            Utolsó frissítés:

            <span id="homeLastUpdate">
                -
            </span>

        </div>

    </div>

</div>
