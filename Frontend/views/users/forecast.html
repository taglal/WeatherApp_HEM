<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forecast</title>

</head>

<body>

<div class="forecast-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="forecast-page-header">

        <div class="forecast-page-icon">

            <i class="bi bi-calendar3-week"></i>

        </div>

        <div>

            <div class="forecast-page-small">
                WEATHER APP
            </div>

            <h3>
                Forecast
            </h3>

            <p>
                A következő napok várható időjárása
            </p>

        </div>

    </div>


    <!-- =====================================================
         SECTION TITLE
    ====================================================== -->

    <div class="forecast-section-title">

        <div>

            <h4>
                <i class="bi bi-cloud-sun"></i>
                Előrejelzés
            </h4>

            <span>
                Következő napok időjárása
            </span>

        </div>

    </div>


    <!-- =====================================================
         FORECAST LIST
    ====================================================== -->

    <div id="forecastList"
         class="forecast-list">

        <!--
            A forecastCtrl.js ide tölti
            az előrejelzési kártyákat.
        -->

    </div>

</div>


<!-- =========================================================
     FORECAST DETAILS MODAL
========================================================= -->

<div class="modal fade"
     id="forecastModal"
     tabindex="-1"
     aria-labelledby="forecastModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content forecast-modal">

            <!-- HEADER -->

            <div class="modal-header">

                <div>

                    <div class="forecast-modal-small">
                        WEATHER FORECAST
                    </div>

                    <h5 class="modal-title"
                        id="forecastModalLabel">

                        <i class="bi bi-cloud-sun"></i>
                        Időjárás részletei

                    </h5>

                </div>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>


            <!-- BODY -->

            <div class="modal-body">

                <!-- DÁTUM / HELYSZÍN -->

                <div class="forecast-modal-top">

                    <div class="forecast-modal-date">

                        <i class="bi bi-calendar3"></i>

                        <span id="forecastModalDate">
                            -
                        </span>

                    </div>

                    <div class="forecast-modal-location">

                        <i class="bi bi-geo-alt-fill"></i>

                        <span id="forecastModalLocation">
                            -
                        </span>

                    </div>

                </div>


                <!-- FŐ IDŐJÁRÁS -->

                <div class="forecast-main-weather">

                    <div class="forecast-main-icon">

                        <i id="forecastModalIcon"
                           class="bi bi-cloud-sun">
                        </i>

                    </div>

                    <div>

                        <div class="forecast-main-type"
                             id="forecastModalType">

                            -

                        </div>

                        <div class="forecast-main-temperature"
                             id="forecastModalTemperature">

                            -- °C

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     ADATOK
                ================================================== -->

                <div class="forecast-detail-grid">


                    <!-- MIN -->

                    <div class="forecast-detail-card">

                        <div class="forecast-detail-icon">

                            <i class="bi bi-thermometer-low"></i>

                        </div>

                        <div class="forecast-detail-title">
                            Minimum
                        </div>

                        <div class="forecast-detail-value"
                             id="forecastModalMin">

                            -- °C

                        </div>

                    </div>


                    <!-- MAX -->

                    <div class="forecast-detail-card">

                        <div class="forecast-detail-icon">

                            <i class="bi bi-thermometer-high"></i>

                        </div>

                        <div class="forecast-detail-title">
                            Maximum
                        </div>

                        <div class="forecast-detail-value"
                             id="forecastModalMax">

                            -- °C

                        </div>

                    </div>


                    <!-- HUMIDITY -->

                    <div class="forecast-detail-card">

                        <div class="forecast-detail-icon">

                            <i class="bi bi-droplet"></i>

                        </div>

                        <div class="forecast-detail-title">
                            Páratartalom
                        </div>

                        <div class="forecast-detail-value"
                             id="forecastModalHumidity">

                            -- %

                        </div>

                    </div>


                    <!-- PRECIPITATION -->

                    <div class="forecast-detail-card">

                        <div class="forecast-detail-icon">

                            <i class="bi bi-cloud-rain"></i>

                        </div>

                        <div class="forecast-detail-title">
                            Csapadék
                        </div>

                        <div class="forecast-detail-value"
                             id="forecastModalPrecipitation">

                            -- mm

                        </div>

                    </div>


                    <!-- WIND -->

                    <div class="forecast-detail-card">

                        <div class="forecast-detail-icon">

                            <i class="bi bi-wind"></i>

                        </div>

                        <div class="forecast-detail-title">
                            Szél
                        </div>

                        <div class="forecast-detail-value"
                             id="forecastModalWind">

                            -- km/h

                        </div>

                    </div>


                    <!-- UV -->

                    <div class="forecast-detail-card">

                        <div class="forecast-detail-icon">

                            <i class="bi bi-sun"></i>

                        </div>

                        <div class="forecast-detail-title">
                            UV-index
                        </div>

                        <div class="forecast-detail-value"
                             id="forecastModalUv">

                            --

                        </div>

                    </div>

                </div>

            </div>


            <!-- FOOTER -->

            <div class="modal-footer">

                <button type="button"
                        class="btn forecast-btn-secondary"
                        data-bs-dismiss="modal">

                    <i class="bi bi-x-lg"></i>

                    Bezárás

                </button>

            </div>

        </div>

    </div>

</div>


<style>

/* =========================================================
   FORECAST PAGE
========================================================= */

.forecast-page {

    width: 100%;

    padding:
        25px
        0
        40px;
}


/* =========================================================
   HEADER
========================================================= */

.forecast-page-header {

    display: flex;

    align-items: center;

    gap: 20px;

    padding: 30px;

    border-radius: 24px;

    margin-bottom: 30px;

    background:
        linear-gradient(
            135deg,
            var(--glass-bg-strong),
            var(--glass-bg)
        );

    border:
        1px solid var(--glass-border);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 20px 55px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.10);
}


/* =========================================================
   HEADER ICON
========================================================= */

.forecast-page-icon {

    width: 70px;

    height: 70px;

    min-width: 70px;

    border-radius: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        var(--highlight-bg);

    color:
        var(--highlight-text);

    font-size: 30px;

    box-shadow:
        0 10px 30px var(--shadow);
}


/* =========================================================
   HEADER TEXT
========================================================= */

.forecast-page-small {

    color:
        var(--text-secondary);

    font-size: 11px;

    letter-spacing: 2px;

    font-weight: 700;

    margin-bottom: 5px;
}


.forecast-page-header h3 {

    margin: 0;

    color:
        var(--text-main);

    font-size: 28px;

    font-weight: 700;
}


.forecast-page-header p {

    margin:
        7px
        0
        0;

    color:
        var(--text-secondary);

    font-size: 14px;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.forecast-section-title {

    margin-bottom: 18px;
}


.forecast-section-title h4 {

    margin: 0;

    color:
        var(--text-main);

    font-size: 20px;

    font-weight: 700;
}


.forecast-section-title h4 i {

    margin-right: 8px;
}


.forecast-section-title span {

    display: block;

    margin-top: 5px;

    color:
        var(--text-muted);

    font-size: 13px;
}


/* =========================================================
   FORECAST LIST
========================================================= */

.forecast-list {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 20px;
}


/* =========================================================
   FORECAST CARD
========================================================= */

.forecast-card {

    position: relative;

    padding: 24px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            var(--glass-bg-strong),
            var(--glass-bg)
        );

    border:
        1px solid var(--glass-border);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 20px 50px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.10);

    color:
        var(--text-main);

    transition:
        transform 0.25s ease,
        background 0.3s ease,
        border-color 0.3s ease;
}


.forecast-card:hover {

    transform:
        translateY(-5px);

    background:
        var(--glass-bg-strong);
}


/* =========================================================
   CARD DATE
========================================================= */

.forecast-card-date {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding-bottom: 15px;

    margin-bottom: 18px;

    border-bottom:
        1px solid var(--glass-border);
}


.forecast-card-day {

    color:
        var(--text-main);

    font-size: 17px;

    font-weight: 700;
}


.forecast-card-date-text {

    color:
        var(--text-secondary);

    font-size: 12px;
}


/* =========================================================
   CARD WEATHER
========================================================= */

.forecast-card-weather {

    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}


.forecast-card-icon {

    width: 55px;

    height: 55px;

    min-width: 55px;

    border-radius: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        var(--highlight-bg);

    color:
        var(--highlight-text);

    font-size: 25px;

    box-shadow:
        0 8px 25px var(--shadow);
}


.forecast-card-type {

    color:
        var(--text-main);

    font-size: 16px;

    font-weight: 700;
}


.forecast-card-location {

    color:
        var(--text-secondary);

    font-size: 12px;

    margin-top: 3px;
}


/* =========================================================
   TEMPERATURE
========================================================= */

.forecast-card-temperature {

    display: flex;

    align-items: baseline;

    gap: 8px;

    margin-bottom: 20px;
}


.forecast-card-temp-main {

    color:
        var(--text-main);

    font-size: 42px;

    line-height: 1;

    font-weight: 700;
}


.forecast-card-temp-range {

    color:
        var(--text-secondary);

    font-size: 13px;
}


/* =========================================================
   CARD DETAILS
========================================================= */

.forecast-card-details {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;
}


.forecast-card-detail {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        10px;

    border-radius: 12px;

    background:
        var(--inner-bg);

    border:
        1px solid transparent;

    color:
        var(--text-secondary);

    font-size: 12px;

    transition:
        0.2s ease;
}


.forecast-card-detail:hover {

    border-color:
        var(--glass-border);

    color:
        var(--text-main);
}


.forecast-card-detail i {

    color:
        var(--text-main);

    font-size: 14px;
}


/* =========================================================
   CARD BUTTON
========================================================= */

.forecast-card-button {

    width: 100%;

    margin-top: 18px;

    padding:
        10px
        14px;

    border-radius: 11px;

    border:
        1px solid var(--glass-border);

    background:
        var(--inner-bg);

    color:
        var(--text-main);

    font-size: 13px;

    font-weight: 600;

    transition:
        0.2s ease;
}


.forecast-card-button:hover {

    background:
        var(--highlight-bg);

    color:
        var(--highlight-text);
}


/* =========================================================
   MODAL
========================================================= */

.forecast-modal {

    background:
        linear-gradient(
            135deg,
            var(--glass-bg-strong),
            var(--glass-bg)
        );

    border:
        1px solid var(--glass-border);

    border-radius: 22px;

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 25px 70px var(--shadow);

    color:
        var(--text-main);

    overflow: hidden;
}


/* =========================================================
   MODAL HEADER
========================================================= */

.forecast-modal .modal-header {

    padding:
        22px
        25px;

    border-bottom:
        1px solid var(--glass-border);
}


.forecast-modal-small {

    color:
        var(--text-secondary);

    font-size: 10px;

    letter-spacing: 2px;

    font-weight: 700;

    margin-bottom: 4px;
}


.forecast-modal .modal-title {

    color:
        var(--text-main);

    font-weight: 700;
}


/* =========================================================
   MODAL TOP
========================================================= */

.forecast-modal-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 25px;
}


.forecast-modal-date,
.forecast-modal-location {

    display: flex;

    align-items: center;

    gap: 7px;

    color:
        var(--text-secondary);

    font-size: 14px;
}


.forecast-modal-date i,
.forecast-modal-location i {

    color:
        var(--text-main);
}


/* =========================================================
   MODAL MAIN WEATHER
========================================================= */

.forecast-main-weather {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    padding:
        25px;

    margin-bottom: 25px;

    border-radius: 18px;

    background:
        var(--inner-bg);

    border:
        1px solid var(--glass-border);
}


.forecast-main-icon {

    width: 70px;

    height: 70px;

    border-radius: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        var(--highlight-bg);

    color:
        var(--highlight-text);

    font-size: 32px;
}


.forecast-main-type {

    color:
        var(--text-secondary);

    font-size: 15px;

    margin-bottom: 4px;
}


.forecast-main-temperature {

    color:
        var(--text-main);

    font-size: 42px;

    line-height: 1;

    font-weight: 700;
}


/* =========================================================
   MODAL DETAIL GRID
========================================================= */

.forecast-detail-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}


.forecast-detail-card {

    padding:
        18px
        12px;

    border-radius: 15px;

    text-align: center;

    background:
        var(--inner-bg);

    border:
        1px solid var(--glass-border);
}


.forecast-detail-icon {

    width: 40px;

    height: 40px;

    margin:
        0
        auto
        9px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        var(--highlight-bg);

    color:
        var(--highlight-text);
}


.forecast-detail-title {

    color:
        var(--text-secondary);

    font-size: 12px;

    margin-bottom: 4px;
}


.forecast-detail-value {

    color:
        var(--text-main);

    font-size: 17px;

    font-weight: 700;
}


/* =========================================================
   MODAL FOOTER
========================================================= */

.forecast-modal .modal-footer {

    padding:
        18px
        25px;

    border-top:
        1px solid var(--glass-border);
}


.forecast-btn-secondary {

    background:
        var(--inner-bg);

    color:
        var(--text-main);

    border:
        1px solid var(--glass-border);

    border-radius: 10px;

    padding:
        9px
        16px;

    font-weight: 600;

    transition:
        0.2s ease;
}


.forecast-btn-secondary:hover {

    background:
        var(--highlight-bg);

    color:
        var(--highlight-text);
}


/* =========================================================
   MODAL CLOSE
========================================================= */

.forecast-modal .btn-close {

    filter: none;
}


body.dark-theme .forecast-modal .btn-close {

    filter: invert(1);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1100px) {

    .forecast-list {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}


@media (max-width: 768px) {

    .forecast-page {

        padding:
            15px
            0
            30px;
    }


    .forecast-page-header {

        padding: 20px;

        border-radius: 18px;
    }


    .forecast-page-icon {

        width: 55px;

        height: 55px;

        min-width: 55px;

        border-radius: 15px;

        font-size: 23px;
    }


    .forecast-page-header h3 {

        font-size: 23px;
    }


    .forecast-list {

        grid-template-columns:
            1fr;
    }


    .forecast-modal-top {

        flex-direction: column;

        align-items: flex-start;
    }


    .forecast-detail-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }
}


@media (max-width: 480px) {

    .forecast-page-header {

        align-items: flex-start;
    }


    .forecast-card {

        padding: 20px;
    }


    .forecast-card-temperature {

        justify-content: center;
    }


    .forecast-detail-grid {

        grid-template-columns:
            1fr;
    }


    .forecast-main-weather {

        padding: 20px;
    }


    .forecast-main-temperature {

        font-size: 34px;
    }
}

</style>

</body>
</html>
